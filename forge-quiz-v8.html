<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — Votre baromètre de récupération</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* D.A. Forge — crème & terracotta */
    --bg:#E7DBCB;--bg2:#FBF6EE;--bg3:#FFFFFF;
    --lime:#E8743B;--lime-b:#D9641F;--lime-d:#C85A1A;   /* accent terracotta (nom conservé) */
    --ink:#1C1A17;--muted:#8A7E6E;--line:rgba(28,26,23,.14);--line2:rgba(28,26,23,.30);
    --danger:#C0552E;--amber:#C8641F;--r:16px;--shadow:0 26px 60px -34px rgba(90,60,30,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Poppins',system-ui,Arial,sans-serif;background:linear-gradient(165deg,#F4ECE0 0%,#E7DBCB 55%,#DBC9B2 100%);background-attachment:fixed;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
  .card{width:100%;max-width:680px;position:relative}
  .mark{display:inline-block;vertical-align:middle}
  .ptop{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .badge{width:30px;height:30px;border-radius:7px;background:var(--lime);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ptrack{flex:1;height:4px;background:rgba(28,26,23,.1);border-radius:4px;overflow:hidden}
  .pfill{height:100%;width:0;background:var(--lime);transition:width .5s cubic-bezier(.4,0,.2,1)}
  .pstep{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.pfill,.fill,.ringfill{transition:none}}
  .panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:30px 32px 26px}
  @media(max-width:540px){.panel{padding:24px 20px 22px}}
  .sec-name{font-weight:600;color:var(--lime);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  h2.page-t{font-weight:300;font-size:25px;line-height:1.16;margin:10px 0 6px;letter-spacing:-.01em}
  h2.page-t b{font-weight:600}
  .page-intro{color:var(--muted);font-size:14px;margin-bottom:22px}
  .q{padding:16px 0;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none;padding-top:4px}
  .q-l{font-size:15.5px;font-weight:500;margin-bottom:12px}
  .q-l .hint{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}
  .sci{color:var(--muted);font-size:10px;font-weight:400;margin-left:2px;opacity:.55;cursor:help}
  .intro-note{font-size:11px;color:var(--muted);opacity:.8;margin:2px auto 0;max-width:460px}
  .opts{display:flex;flex-wrap:wrap;gap:9px}
  .opt{border:1.5px solid var(--line);background:var(--bg3);color:var(--ink);border-radius:11px;padding:11px 15px;font-family:inherit;font-size:14px;cursor:pointer;transition:all .15s;text-align:left}
  .opt:hover{border-color:var(--line2)}
  .opt.sel{border-color:var(--lime);background:rgba(232,116,59,.12);color:var(--ink);font-weight:600}
  .opt:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .opts.stack .opt{width:100%}
  .scale{display:flex;gap:7px}
  .scale button{flex:1;min-width:0;aspect-ratio:1/1;border:1.5px solid var(--line);background:var(--bg3);color:var(--ink);border-radius:10px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:all .13s}
  .scale button:hover{border-color:var(--line2)}
  .scale button.sel{background:var(--lime);border-color:var(--lime);color:#fff}
  .scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:7px}
  .skip-note{font-size:13px;color:var(--muted);font-style:italic;padding:6px 0}
  .legend-sci{font-size:11px;color:var(--muted);margin-top:18px;font-style:italic}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .back{background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;padding:8px 2px}
  .back:hover{color:var(--ink)}
  .back:disabled{opacity:0;pointer-events:none}
  .btn{font-family:inherit;font-weight:600;background:var(--lime);color:var(--ink);border:none;border-radius:12px;padding:13px 26px;font-size:15px;cursor:pointer;transition:all .15s}
  .btn:hover{background:var(--lime-b)}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.32;pointer-events:none}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
  .btn.ghost:hover{background:rgba(28,26,23,.05)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.amber:hover{background:var(--lime-b)}
  .hero{text-align:center;padding:20px 10px 6px}
  .hero h1{font-weight:300;font-size:33px;line-height:1.12;margin:22px 0 8px}
  .hero h1 b{font-weight:600;color:var(--lime)}
  .tagline{color:var(--lime);font-weight:500;letter-spacing:.02em;font-size:15px;margin-bottom:16px}
  .logo-lock{margin-bottom:14px}
  .wordmark{font-weight:500;letter-spacing:.3em;font-size:32px;color:var(--ink);margin:12px 0 6px;padding-left:.3em}
  .logo-lock .tagline{margin-bottom:0}
  .hero .brandline{color:var(--ink);font-size:17px;max-width:430px;margin:8px auto 12px;font-weight:400}
  .hero .brandline b{color:var(--lime);font-weight:600}
  .accroche{font-family:'Archivo',sans-serif;font-weight:800;font-size:38px;text-transform:uppercase;color:var(--ink);line-height:.98;margin:14px auto 10px;letter-spacing:-.01em}
  @media(max-width:540px){.accroche{font-size:30px}}
  .rgpd-note{font-size:11.5px;color:var(--muted);line-height:1.45;margin:12px 0 2px}
  .rgpd-note b{color:var(--ink);font-weight:600}
  .wordmark{font-family:'Archivo',sans-serif}
  .hero-sub{color:var(--muted);font-size:14.5px;max-width:460px;margin:0 auto 22px}
  .hero-sub b{color:var(--ink);font-weight:600}
  .hero p{color:var(--muted);font-size:15px;max-width:460px;margin:0 auto 24px}
  .hero .meta{display:flex;gap:26px;justify-content:center;margin:0 0 26px;flex-wrap:wrap}
  .hero .meta div{font-size:12.5px;color:var(--muted)}
  .hero .meta b{display:block;color:var(--ink);font-weight:600;font-size:15px}
  .intro-fields{max-width:360px;margin:4px auto 4px;text-align:left}
  .row2{display:flex;gap:12px}.row2 .field{flex:1}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .field input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg3);color:var(--ink);font-family:inherit;font-size:15px}
  .field input:focus{outline:none;border-color:var(--lime)}
  .consent{display:flex;gap:11px;align-items:flex-start;margin:12px 0 4px;font-size:13.5px;color:var(--muted)}
  .consent a{color:var(--lime-d);text-decoration:underline}
  .pp{margin:12px 0 2px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg3)}
  .pp summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--ink)}
  .pp p{margin:0 0 8px;line-height:1.45}
  .pp b{color:var(--ink);font-weight:600}
  .consent input{margin-top:2px;width:17px;height:17px;accent-color:var(--lime);flex:0 0 auto}
  .err{color:var(--danger);font-size:13px;min-height:16px;margin-top:4px}
  .hero .err{text-align:center}
  /* results */
  .res-hero{text-align:center;padding:10px 6px 6px}
  .score-big{font-weight:300;font-size:56px;line-height:1;color:var(--lime);margin:8px 0 2px}
  .score-lbl{font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .palier{color:var(--ink);font-size:15px;max-width:480px;margin:14px auto 4px}
  .valo{background:rgba(232,116,59,.1);border:1px solid rgba(232,116,59,.35);border-radius:13px;padding:15px 17px;font-size:14.5px;margin:18px 0 4px;color:var(--ink)}
  .sect{font-weight:600;color:var(--lime);font-size:12px;letter-spacing:.13em;text-transform:uppercase;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
  .sect::after{content:"";flex:1;height:1px;background:var(--line)}
  .advice{border:1.5px solid var(--line);background:var(--bg2);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .advice.demande{border-color:var(--lime);background:rgba(232,116,59,.07)}
  .advice h3{font-weight:600;font-size:16px;margin-bottom:11px}
  .advice h3 .axtag{font-weight:500;font-size:12px;color:var(--muted)}
  .tip{margin-bottom:10px}
  .tip:last-child{margin-bottom:0}
  .tip b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
  .tip span{font-size:13.5px;color:#4A4336}
  .tip .ref{color:var(--muted);font-style:italic;font-size:12px}
  .note-vege{background:#F3E7D8;border-radius:11px;padding:12px 14px;font-size:13px;color:#5A3A22;margin-top:8px}
  .flag{background:rgba(232,116,59,.1);border:1.5px solid rgba(232,116,59,.45);border-radius:14px;padding:20px 20px 18px;margin:6px 0 4px}
  .flag h3{font-weight:600;font-size:18px;margin-bottom:8px;color:var(--lime-d)}
  .flag p{font-size:14.5px;color:var(--ink)}
  .cta{background:var(--bg3);border:1px solid var(--line2);border-radius:14px;padding:20px 20px;margin-top:22px;text-align:center}
  .cta p{color:var(--ink);font-size:14px;margin-bottom:16px;max-width:460px;margin-left:auto;margin-right:auto}
  .cta .btn{min-width:250px}
  .restart-wrap{text-align:center;margin-top:14px}
  .cta p{font-size:14px;color:#4A4336;margin-bottom:14px}
  .cta-row{display:flex;gap:11px;flex-wrap:wrap}
  .cta-row .btn{flex:1;min-width:160px;text-align:center}
  .confirm{font-size:13px;color:var(--lime);margin-top:15px;text-align:center}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
  .fade{animation:fade .32s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>

/* ============ PALIERS ============ */
function palier(score){
  if(score<=20)return "Votre potentiel inexploité est immense : chaque petit ajustement vous apportera des bénéfices immédiats.";
  if(score<=40)return "Les bases sont là, il ne reste qu'à structurer vos habitudes pour franchir un vrai cap d'énergie.";
  if(score<=60)return "Un équilibre déjà solide : ciblez quelques leviers précis pour passer de la simple résistance à la pleine vitalité durable.";
  if(score<=80)return "Excellente gestion de vos ressources : place aux réglages de précision pour maximiser votre forme.";
  return "Maîtrise remarquable : votre récupération est optimale, vous pouvez concentrer votre énergie sur d'autres axes de performance.";
}

function scaleRow(q){let a="";for(let i=q.min;i<=q.max;i++)a+=`<button data-v="${i}" class="${A[q.id]===i?'sel':''}">${i}</button>`;
  return `<div class="scale-ends"><span>${q.lo}</span><span>${q.hi}</span></div><div class="scale">${a}</div>`;}
function choiceRow(q){const s=A[q.id];return `<div class="opts ${q.stack?'stack':''}">${q.o.map(o=>`<button class="opt ${s===o.v?'sel':''}" data-v="${o.v}">${o.t}</button>`).join("")}</div>`;}
function multiRow(q){const s=A[q.id]||[];return `<div class="opts">${q.o.map(o=>`<button class="opt ${s.includes(o.v)?'sel':''}" data-v="${o.v}">${o.t}</button>`).join("")}</div>`;}
function textRow(q){return `<input class="field" id="txt_${q.id}" type="text" value="${A[q.id]||''}" placeholder="${q.hint||''}" style="width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg3);color:var(--ink);font-family:inherit;font-size:15px">`;}

  document.getElementById("back").onclick=()=>{if(pi>0){pi--;render();scrollTop();}};
  document.getElementById("next").onclick=()=>{if(pi<PAGES.length-1){pi++;render();scrollTop();}else{screen="contact";render();scrollTop();}};
}
function onAnswer(pg,q,qEl,btn){const v=btn.dataset.v;
  if(q.type==="scale"){A[q.id]=parseInt(v,10);qEl.querySelectorAll(".scale button").forEach(x=>x.classList.remove("sel"));btn.classList.add("sel");updateNext(pg);}
  else if(q.type==="multi"){let c=A[q.id]?[...A[q.id]]:[];
    if(v===q.none)c=c.includes(v)?[]:[v];else{c=c.filter(x=>x!==q.none);c.includes(v)?c.splice(c.indexOf(v),1):c.push(v);}A[q.id]=c;
    if(pg.id==="douleur"){const y=(typeof window!=="undefined"&&window.scrollY)||0;renderPage(false);if(typeof window!=="undefined")window.scrollTo(0,y);}
    else{qEl.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",(A[q.id]||[]).includes(x.dataset.v)));updateNext(pg);}}
  else{A[q.id]=v;qEl.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));btn.classList.add("sel");updateNext(pg);}
}
function updateNext(pg){const n=card.querySelector("#next");if(n)n.disabled=!pageComplete(pg);}

/* ============ SCORES (6 axes, 0-100) — pondération scientifique ============ */
function dims(){
  // Léger ajustement selon l'âge (déclin physiologique récup/forme après ~35 ans)
  const age=+contact.age||35;
  const ageF=Math.max(0.88,1-Math.max(0,age-35)*0.003);
  // Sommeil : PSQI (qualité, latence, durée, réveils) + régularité MCTQ ; régularité & qualité sur-pondérées (Windred 2024)
  const regM=({tres:1,plutot:.7,assez:.35,var:0})[A.s_reg]??.5;
  const qualM=(((A.s_qual??3)-1)/4);
  const latM=({l15:1,l1530:.66,l3060:.33,l60:0})[A.s_lat]??.5;
  const durM=({d8:.9,d78:1,d67:.66,d56:.33,d5:0})[A.s_duree]??.5;
  const revM=({r0:1,r1:.66,r2:.33,r3:0})[A.s_rev]??.5;
  const sommeil=((1.25*regM+1.25*qualM+latM+durM+revM)/5.5)*100;
  // Forme physique : volume OMS 2020 + statut compétition + malus sédentarité indépendant (Ekelund 2016) + âge
  const freqC=({f0:0,f12:.45,f34:.85,f5:1})[A.freq]??.4;
  const competB=({comp_reg:.10,comp_occ:.05,loisir:0,nonsport:0})[A.compet]??0;
  const travailF=({sed:.85,mixte:1,phys:1.08})[A.travail]??1;
  const forme=Math.max(5,Math.min(100,(freqC*travailF+competB)*100*ageF));
  // Récupération : SRSS (récupération globale, poids 0,7) + signe circulatoire (0,3) + âge
  const recupC=(A.r_recup??3)/6;
  const circC=({lo_j:1,lo_p:.66,lo_s:.33,lo_ts:0})[A.r_lourd]??.66;
  const recup=Math.max(4,(.7*recupC+.3*circC)*100*ageF);
  // Stress & moral : PSS (stress + pression) + WHO-5 (humeur, calme) + lien social (Holt-Lunstad) + nature (White 2019)
  const stressC=(5-(A.b_stress??3))/4;
  const pressC=({p_non:1,p_peu:.5,p_bcp:0})[A.b_pression]??.5;
  const socialC=({soc0:0,soc1:.4,soc2:.75,soc3:1})[A.b_social]??.5;
  const natureC=({ext0:0,ext1:.4,ext2:.75,ext3:1})[A.b_exterieur]??.5;
  const stress=((1.2*stressC+1*(A.b_humeur??2.5)/5+1*(A.b_calme??2.5)/5+0.8*pressC+1*socialC+0.6*natureC)/5.6)*100;
  // Confort / douleurs : NRS (intensité, pesée ×2) + tensions musculaires
  const tC=1-((A.r_tens??3)/6);
  let confort=painActive()?((2*(1-Math.min(1,(A.d_int??5)/10))+tC)/3)*100:tC*100; confort=Math.max(6,confort);
  // Nutrition : indice de qualité (fruits-légumes sur-pondérés) × malus NOVA multiplicatif
  const fl=({fl0:0,fl1:.4,fl2:.75,fl3:1})[A.n_fl]??.5;
  const prot=({p_rare:0,p1:.4,p2:.75,p_almost:1})[A.n_prot]??.5;
  const hyd=({h1:0,h2:.5,h3:.9,h4:1})[A.n_hydra]??.5;
  const poi=({pg0:0,pg1:.35,pg2:.85,pg3:1})[A.n_poisson]??.5;
  const str=({v1:.4,v2:.75,v3:1,v4:.85})[A.n_repas]??.6;
  const base=(1.3*fl+prot+hyd+poi+str)/5.3;
  const malus=({u_rare:1,u_parfois:.9,u_souvent:.8,u_tres:.6})[A.n_ultra]??.9;
  const nutrition=Math.max(4,base*malus*100);
  return {sommeil,forme,recup,stress,confort,nutrition};
}
const AXES=["sommeil","forme","recup","stress","confort","nutrition"];
const AXLBL={sommeil:"Sommeil",forme:"Forme physique",recup:"Récupération",stress:"Stress",confort:"Confort / douleurs",nutrition:"Nutrition"};
const LEVER={sommeil:"votre sommeil",forme:"votre forme physique",recup:"votre récupération",stress:"votre gestion du stress",confort:"votre gestion des douleurs",nutrition:"votre alimentation"};
const RADLBL=["Sommeil","Forme","Récup.","Stress","Confort","Nutrition"];
const OBJ2AXIS={energie:"sommeil",souffler:"stress",douleur:"confort",recup_sport:"recup",force:"forme",longevite:"forme",rehab:"confort"};

function profileKey(){
  if(["comp_reg","comp_occ"].includes(A.compet)||["f34","f5"].includes(A.freq))return "sportif";
  if(A.freq==="f0"&&A.travail==="sed")return "sedentaire";
  if(A.objectif==="rehab"||["reprise","blesse"].includes(A.phase))return "sedentaire";
  return "mixte";
}
function getAdvice(axis){
  if(axis==="recup")return ADVICE.recup[profileKey()];
  if(axis==="nutrition"){const nk=profileKey()==="sportif"?"sportif":"sedentaire";const a=ADVICE.nutrition[nk];
    return {label:a.label,tips:a.tips,vege:["vege","vegan"].includes(A.n_regime)?ADVICE.nutrition.vege:null};}
  return ADVICE[axis];
}

/* ============ PERSONA + CRM ============ */
function persona(){
  let qual;
  if(["comp_reg","comp_occ"].includes(A.compet))qual="Compétiteur";
  else if(["f5","f34"].includes(A.freq))qual="Sportif";
  else if(A.freq==="f12"||A.travail==="phys")qual="Actif";
  else qual="Sédentaire";
  const senior=(+contact.age)>=60;
  const fit=dims().forme;
  let adj;
  if(A.phase==="blesse"||A.objectif==="rehab")adj="blessé";
  else if((A.objectif==="force"||A.objectif==="recup_sport")&&(["comp_reg","comp_occ"].includes(A.compet)||fit>=75))adj="performeur";
  else if(A.objectif==="souffler"||(A.b_stress??0)>=4)adj="stressé";
  else if(A.objectif==="douleur"||painActive())adj="douloureux";
  else if(A.objectif==="energie")adj="en quête d'énergie";
  else if(A.objectif==="longevite")adj="en prévention";
  else if(A.objectif==="recup_sport")adj="en récupération";
  else adj="en équilibre";
  return {label:(senior?"Senior ":"")+qual+" "+adj,qualificatif:qual,adjectif:adj,senior};
}
function besoins(D){
  const map={sommeil:["École du sommeil","Sophrologie","Neuromodulation"],forme:["Coaching","Pilates","Test physiologique"],
    recup:["Bain froid","Sauna","Contraste","Photobiomodulation","Pressothérapie"],stress:["Sophrologie","Neuromodulation","Massage sensoriel","Préparation mentale"],
    confort:["Photobiomodulation","Ostéopathie","École de la douleur","Mobilité"],nutrition:["Conseil nutrition"]};
  const weak=[...AXES].sort((a,b)=>D[a]-D[b]).slice(0,2);
  const set=new Set();[OBJ2AXIS[A.objectif]||weak[0],...weak].forEach(ax=>map[ax].forEach(s=>set.add(s)));
  if(A.phase==="blesse"){["Photobiomodulation","Contraste","Préparation mentale (sportif blessé)"].forEach(s=>set.add(s));}
  return [...set];
}
function submitCRM(){
  const D=dims();const global=Math.round(avg(AXES.map(k=>D[k])));const p=persona();
  const payload={prenom:contact.prenom,nom:contact.nom,age:+contact.age,codePostal:contact.cp||null,
    metier:A.metier||null,retraite:(+contact.age)>=60,enfantsMoins3:A.enfants3==="oui",
    activite:p.qualificatif,senior:p.senior,
    objectifPrioritaire:A.objectif,objectifsSecondaires:A.obj_sec||[],preference:A.pref||null,scores:D,scoreGlobal:global,
    meilleurAxe:[...AXES].sort((a,b)=>D[b]-D[a])[0],axeFaible:[...AXES].sort((a,b)=>D[a]-D[b])[0],
    persona:p.label,besoins:besoins(D),email:contact.email,consentRGPD:contact.rgpd,newsletter:contact.consent,consentementRecherche:contact.science};
  if(typeof window!=="undefined")window.FORGE_LAST_SUBMISSION=payload;
  // horodatage + réponses brutes (pour analyse / calibration ultérieure)
  payload.answers=A; payload.submittedAt=new Date().toISOString();
  try{
    fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload),keepalive:true}).catch(function(){});
  }catch(e){}
}

/* ============ RED FLAGS ============ */
function who5(){return (((A.b_humeur??2.5)+(A.b_calme??2.5)+(A.b_energie??2.5))/15)*100;}
function redFlags(){
  const pa=painActive();
  const sleep3=["assez","var"].includes(A.s_reg)&&["d5","d56"].includes(A.s_duree)&&(A.s_qual??3)<=2;
  const impt=pa&&(A.d_int??0)>7, chronNo=pa&&A.d_anc==="a3plus"&&A.d_eval==="non",
    acuteNo=pa&&["a6","a63"].includes(A.d_anc)&&A.d_eval==="non"&&(A.d_int??0)>5, lowWell=who5()<=40;
  const triggered=sleep3||impt||chronNo||acuteNo||lowWell;
  let kind="general"; if(lowWell)kind="moral"; else if(impt||chronNo||acuteNo)kind="douleur"; else if(sleep3)kind="sommeil";
  return {triggered,kind};
}

/* ============ RADAR ============ */
function radar(vals){
  const cx=150,cy=150,R=92,n=6,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let grid="";[0.25,0.5,0.75,1].forEach(f=>{let p="";for(let i=0;i<n;i++){const[x,y]=pt(i,R*f);p+=`${x.toFixed(1)},${y.toFixed(1)} `;}grid+=`<polygon points="${p}" fill="none" stroke="rgba(28,26,23,.14)" stroke-width="1"/>`;});
  let axes="",labs="";for(let i=0;i<n;i++){const[x,y]=pt(i,R);axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(28,26,23,.14)" stroke-width="1"/>`;
    const[lx,ly]=pt(i,R+20);const an=Math.abs(lx-cx)<6?"middle":(lx>cx?"start":"end");
    labs+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" fill="#1C1A17" font-size="11" font-weight="700" font-family="Poppins,sans-serif" text-anchor="${an}">${RADLBL[i]}</text>`;}
  let dp="",dots="",vlab="";for(let i=0;i<n;i++){const[x,y]=pt(i,R*Math.max(0.05,vals[i]/100));dp+=`${x.toFixed(1)},${y.toFixed(1)} `;dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#C85A1A"/>`;vlab+=`<text x="${x.toFixed(1)}" y="${(y-8).toFixed(1)}" fill="#1C1A17" font-size="10" font-weight="700" font-family="Poppins,sans-serif" text-anchor="middle">${Math.round(vals[i])}%</text>`;}
  return `<svg viewBox="0 0 300 300" width="100%" style="max-width:330px;display:block;margin:6px auto 0">${grid}${axes}<polygon points="${dp}" fill="rgba(232,116,59,.32)" stroke="#D9641F" stroke-width="2"/>${dots}${vlab}${labs}</svg>`;
}

/* ============ RESULTS ============ */
function adviceBlock(axis,isDemande){
  const a=getAdvice(axis);
  let tips=a.tips.map(t=>`<div class="tip"><b>${t.h}</b><span>${t.t}${t.ref?` <span class="ref">(${t.ref})</span>`:""}</span></div>`).join("");
  const vege=a.vege?`<div class="note-vege">${a.vege}</div>`:"";
  return `<div class="advice ${isDemande?'demande':''}"><h3>${isDemande?"Répondre à votre priorité":"Votre prochain levier"} <span class="axtag">· ${AXLBL[axis]}</span></h3>${tips}${vege}</div>`;
}
function renderResults(){
  const flag=redFlags();const D=dims();const vals=AXES.map(k=>D[k]);
  const global=Math.round(avg(vals));const nom=contact.prenom||"";
  const best=[...AXES].sort((a,b)=>D[b]-D[a])[0];const weak=[...AXES].sort((a,b)=>D[a]-D[b])[0];
  const demandeAxis=OBJ2AXIS[A.objectif]||weak;
  let secondAxis=weak; if(secondAxis===demandeAxis){secondAxis=[...AXES].sort((a,b)=>D[a]-D[b]).find(k=>k!==demandeAxis);}
  let flagHTML="";
  if(flag.triggered){
    const why={moral:"Vos réponses sur votre moral et votre énergie sont basses : dans ce cas, un accompagnement humain est préférable à un protocole automatique.",
      douleur:"Vous décrivez une douleur importante ou pas encore évaluée médicalement : par prudence, un avis humain doit précéder tout protocole.",
      sommeil:"Votre sommeil paraît durablement perturbé sur plusieurs plans : mieux vaut en parler pour construire une réponse vraiment adaptée.",
      general:"Certaines de vos réponses méritent un échange humain avant tout protocole."}[flag.kind];
    flagHTML=`<div class="flag"><h3>On vous recommande d'abord d'échanger avec un conseiller</h3>
      <p>${why} Un conseiller Forge fera le point avec vous et pourra, si nécessaire, vous orienter vers un professionnel de santé (médecin…). Votre bilan complet reste affiché juste en dessous.</p>
      <button class="btn amber" id="talk" style="margin-top:14px;min-width:240px">Parler à un conseiller</button></div>`;
  }
  card.innerHTML=`<div class="panel fade">
    <div class="res-hero">${wave(42)}<div class="score-lbl">Votre bilan</div>
      ${nom?`<div class="palier" style="margin-top:6px">${nom}, voici votre baromètre de récupération.</div>`:""}</div>
    ${flagHTML}
    <div class="res-hero" style="padding-top:10px">
      <div class="score-lbl">Votre capital récupération</div>
      <div class="score-big">${global}%</div>
      <div class="palier">${nom?nom+", vous":"Vous"} mobilisez ${global} % de votre capital récupération. ${palier(global)}</div>
    </div>
    ${radar(vals)}
    <div class="valo">Bravo, vous mobilisez déjà bien <b>${LEVER[best]}</b> comme levier. La science le montre : un seul changement ciblé suffit à améliorer tout l'équilibre. Maintenez cet acquis, et concentrez votre énergie sur un axe à la fois — un pas après l'autre, pour des progrès durables.</div>
    <div class="sect">Vos conseils</div>
    ${adviceBlock(demandeAxis,true)}
    ${secondAxis&&secondAxis!==demandeAxis?adviceBlock(secondAxis,false):""}
    <div class="cta"><p>Chez Forge, on conçoit des programmes personnalisés pour progresser plus vite et ancrer vos résultats dans la durée. Rejoignez la communauté.</p>
      <button class="btn" id="join">Rejoindre la communauté Forge</button></div>
    <div class="restart-wrap"><button class="btn ghost" id="restart">Refaire le bilan</button></div>
    ${contact.consent?`<div class="confirm">✓ Merci ${contact.prenom||""} — tu es inscrit(e) à la newsletter Forge.</div>`:`<div class="confirm">✓ Merci ${contact.prenom||""}, ton bilan est enregistré.</div>`}
    <p class="foot">Baromètre de bien-être fondé sur la littérature — ne remplace pas un avis médical. En cas de douleur aiguë, de mal-être important ou de doute, consultez un professionnel de santé.</p></div>`;
  const talk=document.getElementById("talk");if(talk)talk.onclick=()=>alert("→ Prise de contact avec un conseiller Forge.");
  document.getElementById("restart").onclick=resetAll;
  document.getElementById("join").onclick=()=>alert("→ Rejoindre la communauté / les accompagnements Forge.");
}
function resetAll(){A={};pi=0;contact={prenom:"",nom:"",age:"",cp:"",email:"",rgpd:false,consent:false,science:false};screen="intro";render();}
render();
</script>
